<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Директолог</title>
  <desc id="desc">Поисковая реклама под контролем. Спрос, решения и проверка результата.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0B1220"/><stop offset="1" stop-color="#142E38"/></linearGradient>
    <linearGradient id="line"><stop stop-color="#2DD4BF"/><stop offset="1" stop-color="#A7F3D0"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#94A3B8" stroke-opacity=".06"/></pattern>
  </defs>
  <rect width="1200" height="400" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="400" rx="20" fill="url(#grid)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="56" y="52" width="7" height="20" rx="3" fill="#5EEAD4"/>
    <text x="78" y="68" fill="#99B4C2" font-size="15" font-weight="700" letter-spacing="3">CODEX / YANDEX DIRECT</text>
    <text x="54" y="167" fill="#F1F5F9" font-size="72" font-weight="700" letter-spacing="-2">Директолог</text>
    <text x="58" y="218" fill="#CCDFE5" font-size="27">Поисковая реклама под контролем</text>
    <text x="58" y="259" fill="#88A6B5" font-size="19">Вы задаёте рамки. Агент работает внутри.</text>
    <rect x="58" y="312" width="124" height="32" rx="16" fill="#153D40" stroke="#275653"/>
    <text x="120" y="333" text-anchor="middle" fill="#99F6E4" font-size="12" font-weight="700" letter-spacing="1.5">OPEN SOURCE</text>
    <text x="202" y="333" fill="#88A6B5" font-size="14">Данные → решение → проверка</text>
    <g transform="translate(800 60)">
      <circle cx="170" cy="140" r="128" fill="none" stroke="#29505A"/>
      <circle cx="170" cy="140" r="94" fill="none" stroke="#23434E" stroke-dasharray="4 9"/>
      <path d="M28 196H93L144 140H207L256 84H316" fill="none" stroke="url(#line)" stroke-width="4" stroke-linejoin="round"/>
      <g fill="#102630" stroke="#5EEAD4" stroke-width="3"><circle cx="28" cy="196" r="8"/><circle cx="144" cy="140" r="8"/><circle cx="256" cy="84" r="8"/></g>
      <rect x="217" y="178" width="98" height="64" rx="12" fill="#112F37" stroke="#37635F"/>
      <path d="m249 210 11 11 22-24" fill="none" stroke="#A7F3D0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="4" y="241" fill="#88A6B5" font-size="13" letter-spacing="1">СПРОС</text>
      <text x="104" y="113" fill="#88A6B5" font-size="13" letter-spacing="1">РЕШЕНИЕ</text>
      <text x="225" y="271" fill="#88A6B5" font-size="13" letter-spacing="1">ПРОВЕРКА</text>
    </g>
  </g>
</svg>
